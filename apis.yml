name: Dattch
description: Dattch (now HER, weareher.com) is a dating and social community app for LGBTQ+ women, nonbinary,
  and queer people, founded by Robyn Exton. The platform pairs one-to-one matching with community spaces,
  events, and social feeds, and reports more than 15 million users across 114+ countries. It operates as a
  consumer mobile application on iOS and Android with no publicly documented developer API, developer portal,
  or OpenAPI surface. Surfaced as a portfolio company of 500 Global and tracked in the API Evangelist network.
